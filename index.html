<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 1st Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=Caveat:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1620; --plum:#5a1e3a; --rose:#d9577a; --blush:#f6d9de;
    --cream:#fff8f1; --paper:#fdf6ee; --gold:#c9974a; --muted:#8a6b76;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fbe3e9;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:300;letter-spacing:-.01em}
  .hand{font-family:Caveat,cursive}
  button{font:inherit;border:0;cursor:pointer;background:none;color:inherit}

  /* ---------- Envelope intro ---------- */
  #gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#ffd6e2,#f7a1bb 55%,#e86f95 100%);transition:opacity 1s ease,visibility 1s}
  #gate.gone{opacity:0;visibility:hidden}
  .gate-inner{text-align:center;color:var(--plum);padding:24px}
  .gate-inner p{font-size:.8rem;letter-spacing:.25em;text-transform:uppercase;font-weight:500;opacity:.85;margin-top:28px}
  .envelope{width:min(280px,72vw);aspect-ratio:1.45;position:relative;margin:0 auto;cursor:pointer;filter:drop-shadow(0 20px 40px rgba(150,30,70,.35));animation:bob 3s ease-in-out infinite}
  .envelope .body{position:absolute;inset:0;background:var(--paper);border-radius:6px}
  .envelope .flap{position:absolute;left:0;right:0;top:0;height:62%;background:#f3e2cf;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:2}
  .envelope .front{position:absolute;inset:0;background:linear-gradient(to top right,#f7e8d6 50%,transparent 50%),linear-gradient(to top left,#f7e8d6 50%,transparent 50%);border-radius:6px;z-index:3}
  .envelope .seal{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--rose);display:grid;place-items:center;color:#fff;font-size:22px;z-index:4;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);transition:transform .5s}
  .envelope .to{position:absolute;bottom:14%;left:0;right:0;text-align:center;z-index:4;color:var(--plum);font-size:1.6rem}
  .envelope.open .flap{transform:rotateX(180deg)}
  .envelope.open .seal{transform:translate(-50%,-50%) scale(0)}
  @keyframes bob{50%{transform:translateY(-8px)}}

  /* ---------- Album shell ---------- */
  #album{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 14px calc(14px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at top,#ffe9ef,#f7cdd8 70%,#efb3c4)}
  .book{position:relative;width:min(620px,100%);flex:1;max-height:780px;perspective:1800px}
  .page{position:absolute;inset:0;background:var(--paper);border-radius:16px;box-shadow:0 30px 60px rgba(120,30,70,.18),0 2px 0 #ead9c8;
        display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(26px,6vw,54px) clamp(22px,6vw,56px);
        overflow:hidden;opacity:0;visibility:hidden;transform-origin:left center;transform:translateX(70px) rotateY(-14deg);
        transition:opacity .6s ease,transform .75s cubic-bezier(.2,.7,.2,1),visibility .75s}
  .page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg,rgba(120,60,80,.10),transparent);pointer-events:none}
  .page::after{content:"";position:absolute;inset:12px;border:1px solid #efdfd0;border-radius:10px;pointer-events:none}
  .page.active{opacity:1;visibility:visible;transform:none;z-index:2}
  .page.past{transform:translateX(-70px) rotateY(14deg)}
  .anim{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease}
  .page.active .anim{opacity:1;transform:none;transition-delay:var(--d,.25s)}

  .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);font-weight:500;margin-bottom:14px}
  .title{font-size:clamp(1.9rem,6vw,3rem);line-height:1.08;color:var(--plum)}
  .title em{font-style:italic;color:var(--rose)}
  .text{color:var(--muted);line-height:1.65;max-width:420px;margin-top:16px;font-size:1rem}

  .nav{width:min(620px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
  .nav button{padding:13px 22px;border-radius:999px;font-weight:500;font-size:.95rem;transition:transform .15s,opacity .3s}
  .nav button:active{transform:scale(.95)}
  #prev{color:var(--plum);background:rgba(255,255,255,.6)}
  #next{background:var(--rose);color:#fff;box-shadow:0 10px 24px rgba(217,87,122,.35)}
  .nav button:disabled{opacity:0;pointer-events:none}
  .progress{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--plum);letter-spacing:.12em}
  .bar{width:100%;max-width:180px;height:3px;background:rgba(90,30,58,.12);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--rose);width:0;transition:width .5s ease}

  /* ---------- Cover ---------- */
  .cover .hand{font-size:clamp(1.7rem,5.5vw,2.4rem);color:var(--rose);margin-bottom:8px}
  .cover h1{font-size:clamp(2.6rem,11vw,5rem);line-height:.95;color:var(--plum)}
  .cover h1 em{color:var(--rose)}
  .cover .names{margin-top:22px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-size:.8rem}
  .cover .tip{margin-top:38px;font-size:.8rem;color:var(--muted)}

  /* ---------- Counter ---------- */
  .counter{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px;width:100%;max-width:380px}
  .unit{background:#fff;border:1px solid #f0dde1;border-radius:16px;padding:18px 6px}
  .unit b{display:block;font-family:Fraunces,serif;font-weight:300;font-size:clamp(2rem,8vw,3rem);color:var(--plum);font-variant-numeric:tabular-nums}
  .unit span{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .since{margin-top:16px;color:var(--muted);font-size:.88rem}

  /* ---------- Story ---------- */
  .story .emoji{font-size:clamp(3rem,10vw,4.2rem);margin-bottom:18px}
  .story.has-shots{justify-content:flex-start;padding-top:clamp(30px,5svh,48px)}
  .story.has-shots .emoji{display:none}
  .story.has-shots .title{font-size:clamp(1.7rem,5.5vw,2.4rem)}
  .collage{position:relative;display:flex;justify-content:center;align-items:center;flex:1;min-height:0;width:100%;container-type:size;margin-top:clamp(10px,2svh,22px)}
  .shot{position:relative;height:min(96cqh,420px,82cqw);aspect-ratio:720/1342;background:#fff;padding:7px;border-radius:14px;
        box-shadow:0 18px 36px rgba(90,30,58,.22);flex-shrink:0}
  .shot img{display:block;width:100%;height:100%;object-fit:cover;border-radius:9px}
  .shot::before{content:"";position:absolute;top:-11px;left:50%;width:74px;height:24px;margin-left:-37px;background:rgba(247,161,187,.6);
        border-left:2px dashed rgba(255,255,255,.6);border-right:2px dashed rgba(255,255,255,.6);transform:rotate(-4deg);z-index:2}
  .shot:nth-child(1){transform:rotate(-6deg) translate(14px,-6px);z-index:1}
  .shot:nth-child(2){transform:rotate(5deg) translate(-14px,14px);z-index:2}
  .shot:nth-child(2)::before{transform:rotate(5deg);background:rgba(201,151,74,.45)}
  .story .note{font-family:Caveat,cursive;font-size:clamp(1.4rem,4.6vw,1.75rem);color:var(--rose);line-height:1.2;margin-top:clamp(14px,2.4svh,24px);max-width:420px}
  .story .date{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:10px}

  /* ---------- Photos ---------- */
  .polaroid{background:#fff;padding:12px 12px 0;box-shadow:0 14px 34px rgba(90,30,58,.18);border-radius:3px;display:inline-block}
  .page.active .polaroid{transform:rotate(var(--tilt,-2deg))}
  .polaroid .ph{height:min(330px,46svh,64vw);aspect-ratio:1;border-radius:2px;display:grid;place-items:center;font-size:3.4rem;background-size:cover;background-position:center}
  .polaroid .cap{font-family:Caveat,cursive;font-size:1.6rem;padding:12px 4px 14px;color:var(--plum)}

  /* ---------- Reasons ---------- */
  .card-stage{perspective:1200px;margin-top:24px;height:min(360px,46svh);aspect-ratio:3/4;cursor:pointer;position:relative}
  .rcard{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.3,1)}
  .rcard.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px;box-shadow:0 20px 40px rgba(90,30,58,.2)}
  .front-f{background:linear-gradient(150deg,var(--plum),#8b2f57);color:var(--blush)}
  .front-f .big{font-family:Fraunces,serif;font-size:4.4rem;font-weight:300;line-height:1}
  .front-f small{letter-spacing:.22em;text-transform:uppercase;font-size:.68rem;margin-top:12px;opacity:.8}
  .back-f{background:#fff;transform:rotateY(180deg);border:1px solid #f0dde1}
  .back-f .n{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
  .back-f p{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:clamp(1.2rem,4.4vw,1.45rem);line-height:1.35;color:var(--plum);margin-top:14px}
  .hint{margin-top:16px;color:var(--muted);font-size:.82rem}

  /* ---------- Letter ---------- */
  .page.letter-page{justify-content:flex-start;text-align:left;align-items:stretch;
        background-image:repeating-linear-gradient(transparent 0 33px,#efdccb 33px 34px);background-color:var(--paper)}
  .letter-page .eyebrow{text-align:center}
  .letter-body{flex:1;overflow-y:auto;scrollbar-width:none;margin-top:6px}
  .letter-body::-webkit-scrollbar{display:none}
  .letter-body .hand{font-size:clamp(1.25rem,3.8vw,1.55rem);line-height:34px;color:#3b2230;white-space:pre-wrap}
  .caret{display:inline-block;width:2px;height:1.1em;background:var(--rose);vertical-align:middle;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- Finale ---------- */
  .btns{display:flex;gap:14px;margin-top:32px;justify-content:center;flex-wrap:wrap}
  .yes{background:var(--rose);color:#fff;padding:15px 34px;border-radius:999px;font-size:1.05rem;font-weight:500;box-shadow:0 12px 28px rgba(217,87,122,.35);transition:transform .2s}
  .no{color:var(--muted);padding:15px 26px;border-radius:999px;border:1px solid #e6cfd5;transition:transform .25s ease}
  .answer{margin-top:28px;opacity:0;transition:opacity 1s}
  .answer.on{opacity:1}
  .answer .hand{font-size:clamp(2rem,7vw,2.8rem);color:var(--rose)}
  .answer small{display:block;margin-top:10px;color:var(--muted);font-size:.8rem}

  .heart{position:fixed;pointer-events:none;z-index:60;animation:float linear forwards;user-select:none}
  @keyframes float{to{transform:translateY(-110vh) rotate(var(--r));opacity:0}}

  @media(max-height:640px){
    .cover .tip{margin-top:20px}
    .story .emoji{margin-bottom:8px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- =================== ENVELOPE =================== -->
<div id="gate">
  <div class="gate-inner">
    <div class="envelope" id="envelope" role="button" aria-label="Open the letter">
      <div class="body"></div><div class="flap"></div><div class="front"></div>
      <div class="seal">♥</div>
      <div class="to hand" id="envTo">For you</div>
    </div>
    <p>tap to open</p>
  </div>
</div>

<!-- =================== ALBUM =================== -->
<div id="album">
  <div class="book" id="book"></div>
  <div class="nav">
    <button id="prev" aria-label="Previous page">← Back</button>
    <div class="progress"><span id="pageNum">1 / 1</span><div class="bar"><i id="barFill"></i></div></div>
    <button id="next" aria-label="Next page">Next →</button>
  </div>
</div>

<script>
/* ==============================================================
   EDIT EVERYTHING HERE ✏️  — names, date, story, photos, letter
   ============================================================== */
const CONFIG = {
  herName: "Vika",                   // her name or nickname
  yourName: "Dennis",                // your name
  greeting: "Hello my love,",        // first line on the cover page
  startDate: "2025-12-05T00:00:00",  // the day you became official (YYYY-MM-DDTHH:MM:SS)

  // each moment = one page of the album. Add images: ["photos/x.jpg", ...] to show pictures on that page
  story: [
    { emoji: "👋", date: "The first hello", title: "Where it all started", text: "From \"okee sahabat denis\" to my favourite person 💕",
      images: ["photos/chat1.jpeg", "photos/chat2.jpeg"] },
    { emoji: "☕", date: "First date",      title: "Nervous & happy",     text: "Where did you go? What did you eat? What made you want a second date?" },
    { emoji: "💌", date: "Becoming us",     title: "Official",            text: "The day you asked her (or she asked you!). What did it feel like?" },
    { emoji: "🎡", date: "Favourite trip",  title: "Our little adventure", text: "A trip, a day out, or a random night that became a favourite memory." },
    { emoji: "🌷", date: "Today",           title: "Almost one year",      text: "Almost a whole year later and I'd choose you again, every single time." }
  ],

  // each photo = one page. photo: "photos/1.jpg" (upload to a photos folder). Leave "" for the emoji placeholder.
  photos: [
    { photo: "", emoji: "☕", caption: "our first date" },
    { photo: "", emoji: "🌅", caption: "that sunset" },
    { photo: "", emoji: "🍜", caption: "late-night food" },
    { photo: "", emoji: "📸", caption: "your favourite pic" },
    { photo: "", emoji: "🎡", caption: "our trip" },
    { photo: "", emoji: "💕", caption: "us, always" }
  ],

  reasons: [
    "The way you laugh at your own jokes before you finish them.",
    "You make ordinary days feel like something worth remembering.",
    "How you always know when something's wrong, even when I say I'm fine.",
    "Your kindness — to me, to strangers, to everyone.",
    "You make me want to be a better person.",
    "The face you make when food is really good.",
    "You're my favourite person to do nothing with.",
    "You believe in me, even when I don't.",
    "Your hugs fix things words can't.",
    "You're beautiful, and you don't even try.",
    "Every plan I make for the future has you in it.",
    "Because you're you. That's the whole reason."
  ],

  letter:
`Dear {her},

One year ago I had no idea how much my life was about to change.

Thank you for every laugh, every late-night talk, every time you stayed patient with me. You've turned "me" into "us", and I wouldn't trade it for anything.

Here's to our first year — and to all the years after it.

I love you. Always.

— {you}`
};
/* ============================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fill = s => s.replace(/\{her\}/g, CONFIG.herName).replace(/\{you\}/g, CONFIG.yourName);
$("envTo").textContent = "For " + CONFIG.herName + " 💕";

/* ---------- build the album pages ---------- */
const pages = [];
const add = (html, cls = "", onEnter) => pages.push({ html, cls, onEnter });

// cover
add(`<div class="hand anim" style="--d:.2s">${esc(CONFIG.greeting)}</div>
     <h1 class="anim" style="--d:.4s">Happy <em>1st</em><br>Anniversary</h1>
     <div class="names anim" style="--d:.7s">${esc(CONFIG.yourName)} &amp; ${esc(CONFIG.herName)}</div>
     <div class="tip anim" style="--d:1.1s">tap Next to turn the page →</div>`, "cover");

// counter
add(`<div class="eyebrow anim" style="--d:.2s">Time together</div>
     <h2 class="title anim" style="--d:.35s">Every second <em>counts</em></h2>
     <div class="counter anim" style="--d:.55s">
       <div class="unit"><b id="cD">0</b><span>days</span></div>
       <div class="unit"><b id="cH">0</b><span>hours</span></div>
       <div class="unit"><b id="cM">0</b><span>minutes</span></div>
       <div class="unit"><b id="cS">0</b><span>seconds</span></div>
     </div>
     <p class="since anim" id="since" style="--d:.75s"></p>
     <p class="since anim" id="until" style="--d:.95s;color:var(--rose);font-weight:500"></p>`);

// story chapters
CONFIG.story.forEach((m, i) => add(
  `<div class="eyebrow anim" style="--d:.15s">Our story · ${i+1} of ${CONFIG.story.length}</div>
   <div class="emoji anim" style="--d:.3s">${m.emoji || "♥"}</div>
   <div class="date anim" style="--d:.4s">${esc(m.date)}</div>
   <h2 class="title anim" style="--d:.5s">${esc(m.title)}</h2>
   ${m.images
     ? `<div class="collage anim" style="--d:.65s">${m.images.map(src => `<div class="shot"><img src="${src}" alt=""></div>`).join("")}</div>
        <p class="note anim" style="--d:.9s">${esc(m.text)}</p>`
     : `<p class="text anim" style="--d:.65s">${esc(m.text)}</p>`}`,
  m.images ? "story has-shots" : "story"));

// photos
const grads = ["#f6d9de,#f1b7c4","#fbe7d0,#f2c79a","#e9dff3,#c9b4e6","#d9ecef,#a9d3da","#fde2e4,#e9a3b6","#f3e2cf,#e2c08f"];
CONFIG.photos.forEach((p, i) => {
  const style = p.photo ? `background-image:url('${p.photo}')` : `background:linear-gradient(135deg,${grads[i % grads.length]})`;
  add(`<div class="eyebrow anim" style="--d:.15s">Little moments · ${i+1} of ${CONFIG.photos.length}</div>
       <div class="polaroid anim" style="--d:.3s;--tilt:${i % 2 ? 2 : -2}deg">
         <div class="ph" style="${style}">${p.photo ? "" : p.emoji}</div>
         <div class="cap">${esc(p.caption)}</div>
       </div>`);
});

// reasons
add(`<div class="eyebrow anim" style="--d:.15s">Just a few of them</div>
     <h2 class="title anim" style="--d:.3s">Reasons I <em>love</em> you</h2>
     <div class="card-stage anim" id="stage" style="--d:.5s">
       <div class="rcard" id="rcard">
         <div class="face front-f"><div class="big">${CONFIG.reasons.length}</div><small>reasons · tap me</small></div>
         <div class="face back-f"><div class="n" id="rNum"></div><p id="rText"></p></div>
       </div>
     </div>
     <p class="hint anim" id="rHint" style="--d:.7s">Tap the card to flip</p>`);

// letter
add(`<div class="eyebrow">A letter for you</div>
     <div class="letter-body" id="letterBody"><div class="hand" id="letterText"></div></div>`,
    "letter-page", typeLetter);

// finale
add(`<div class="eyebrow anim" style="--d:.15s">One last thing</div>
     <h2 class="title anim" style="--d:.3s">Year two,<br><em>together?</em></h2>
     <div class="btns anim" style="--d:.55s">
       <button class="yes" id="yes">Yes, always ♥</button>
       <button class="no" id="no">No</button>
     </div>
     <div class="answer" id="answer"><div class="hand">I knew it. I love you.</div>
       <small>made with love by ${esc(CONFIG.yourName)}, just for ${esc(CONFIG.herName)}</small></div>`);

$("book").innerHTML = pages.map((p, i) => `<section class="page ${p.cls}" data-i="${i}">${p.html}</section>`).join("");
const pageEls = [...document.querySelectorAll(".page")];

/* ---------- page turning ---------- */
let cur = 0;
function go(n){
  if(n < 0 || n >= pages.length) return;
  cur = n;
  pageEls.forEach((el, i) => {
    el.classList.toggle("active", i === cur);
    el.classList.toggle("past", i < cur);
  });
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === pages.length - 1;
  $("pageNum").textContent = `${cur+1} / ${pages.length}`;
  $("barFill").style.width = ((cur+1) / pages.length * 100) + "%";
  if(pages[cur].onEnter) pages[cur].onEnter();
}
$("next").addEventListener("click", () => go(cur + 1));
$("prev").addEventListener("click", () => go(cur - 1));
document.addEventListener("keydown", e => {
  if(!$("gate").classList.contains("gone")) return;
  if(e.key === "ArrowRight") go(cur + 1);
  if(e.key === "ArrowLeft") go(cur - 1);
});
// swipe left / right on phones
let sx = 0, sy = 0;
$("book").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("book").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1));
}, {passive:true});

/* ---------- floating hearts ---------- */
function hearts(n = 24, x, y){
  const chars = ["♥","❤","💕","💗","✨"];
  for(let i=0;i<n;i++){
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = chars[Math.floor(Math.random()*chars.length)];
    h.style.left = (x ?? Math.random()*innerWidth) + (Math.random()*120-60) + "px";
    h.style.top = (y ?? innerHeight) + "px";
    h.style.fontSize = (14 + Math.random()*22) + "px";
    h.style.color = ["#d9577a","#f19bb0","#c9974a","#5a1e3a"][i%4];
    h.style.setProperty("--r", (Math.random()*80-40) + "deg");
    h.style.animationDuration = (2.5 + Math.random()*2.5) + "s";
    h.style.animationDelay = (Math.random()*.6) + "s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 6000);
  }
}

/* ---------- envelope ---------- */
$("envelope").addEventListener("click", () => {
  $("envelope").classList.add("open");
  hearts(30, innerWidth/2, innerHeight/2);
  setTimeout(()=>{ $("gate").classList.add("gone"); go(0); }, 900);
});

/* ---------- counter ---------- */
const start = new Date(CONFIG.startDate);
$("since").textContent = "since " + start.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
function tick(){
  let d = Math.max(0, Date.now() - start);
  const D = Math.floor(d/864e5); d -= D*864e5;
  const H = Math.floor(d/36e5);  d -= H*36e5;
  const M = Math.floor(d/6e4);   d -= M*6e4;
  $("cD").textContent = D; $("cH").textContent = H;
  $("cM").textContent = M; $("cS").textContent = Math.floor(d/1e3);
}
tick(); setInterval(tick, 1000);
const anniv = new Date(start); anniv.setFullYear(start.getFullYear() + 1);
const daysLeft = Math.ceil((anniv - Date.now()) / 864e5);
$("until").textContent = daysLeft > 0 ? `and ${daysLeft} more days until our 1st anniversary 💕` : "and it's officially been a whole year 💕";

/* ---------- reasons card ---------- */
let r = -1; const card = $("rcard");
$("stage").addEventListener("click", () => {
  if(card.classList.contains("flipped")){
    card.classList.remove("flipped");
    $("rHint").textContent = r >= CONFIG.reasons.length-1 ? "That's all of them… for now. Tap to start again" : "Tap for the next one";
    return;
  }
  r = (r+1) % CONFIG.reasons.length;
  $("rNum").textContent = `Reason ${r+1} of ${CONFIG.reasons.length}`;
  $("rText").textContent = CONFIG.reasons[r];
  card.classList.add("flipped");
  $("rHint").textContent = "Tap to flip back";
});

/* ---------- letter typewriter ---------- */
let typed = false;
function typeLetter(){
  if(typed) return; typed = true;
  const text = fill(CONFIG.letter), el = $("letterText"), box = $("letterBody");
  el.innerHTML = '<span></span><i class="caret"></i>';
  const span = el.firstChild; let i = 0;
  setTimeout(function step(){
    span.textContent = text.slice(0, ++i);
    box.scrollTop = box.scrollHeight;
    if(i < text.length) setTimeout(step, text[i-1] === "\n" ? 260 : 34);
    else el.querySelector(".caret").remove();
  }, 600);
}

/* ---------- finale ---------- */
const no = $("no"); let dodges = 0;
const noTexts = ["No","Are you sure?","Really??","Try again 🙃","Nope, not allowed","Just press yes ♥"];
function dodge(){
  dodges++;
  no.textContent = noTexts[Math.min(dodges, noTexts.length-1)];
  no.style.transform = `translate(${Math.random()*140-70}px, ${Math.random()*70-35}px)`;
  $("yes").style.transform = `scale(${1 + Math.min(dodges,6)*.08})`;
}
no.addEventListener("mouseenter", dodge);
no.addEventListener("click", e => { e.preventDefault(); dodge(); });
$("yes").addEventListener("click", () => {
  $("answer").classList.add("on"); no.style.display = "none";
  for(let k=0;k<4;k++) setTimeout(()=>hearts(28), k*400);
});
</script>
