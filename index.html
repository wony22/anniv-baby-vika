<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 1st Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=Caveat:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1620; --plum:#5a1e3a; --rose:#d9577a; --blush:#f6d9de;
    --cream:#fff8f1; --paper:#fdf3e7; --gold:#c9974a; --muted:#8a6b76;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:300;letter-spacing:-.01em}
  .hand{font-family:Caveat,cursive}
  section{padding:96px 22px;max-width:1040px;margin:0 auto}
  .eyebrow{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);font-weight:500;margin-bottom:14px}
  .title{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;color:var(--plum)}
  .title em{font-style:italic;color:var(--rose)}
  .lead{color:var(--muted);max-width:520px;margin-top:14px;line-height:1.6}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}
  .reveal.in{opacity:1;transform:none}

  /* ---------- Intro gate ---------- */
  #gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#ffd6e2,#f7a1bb 55%,#e86f95 100%);transition:opacity 1s ease,visibility 1s}
  #gate.gone{opacity:0;visibility:hidden}
  .gate-inner{text-align:center;color:var(--plum);padding:24px}
  .gate-inner p{font-size:.8rem;letter-spacing:.25em;text-transform:uppercase;font-weight:500;opacity:.85;margin-top:28px}
  .envelope{width:min(280px,72vw);aspect-ratio:1.45;position:relative;margin:0 auto;cursor:pointer;filter:drop-shadow(0 20px 40px rgba(150,30,70,.35));animation:bob 3s ease-in-out infinite}
  .envelope .body{position:absolute;inset:0;background:var(--paper);border-radius:6px}
  .envelope .flap{position:absolute;left:0;right:0;top:0;height:62%;background:#f3e2cf;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:2}
  .envelope .front{position:absolute;inset:0;background:linear-gradient(to top right,#f7e8d6 50%,transparent 50%),linear-gradient(to top left,#f7e8d6 50%,transparent 50%);border-radius:6px;z-index:3}
  .envelope .seal{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--rose);display:grid;place-items:center;color:#fff;font-size:22px;z-index:4;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);transition:transform .5s}
  .envelope .to{position:absolute;bottom:14%;left:0;right:0;text-align:center;z-index:4;color:var(--plum);font-size:1.6rem}
  .envelope.open .flap{transform:rotateX(180deg)}
  .envelope.open .seal{transform:translate(-50%,-50%) scale(0)}
  @keyframes bob{50%{transform:translateY(-8px)}}

  /* ---------- Hero ---------- */
  #hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:none;background:radial-gradient(ellipse at top,#fbe3e7,var(--cream) 60%);position:relative;overflow:hidden}
  #hero h1{font-size:clamp(2.6rem,10vw,6.2rem);line-height:.95;color:var(--plum)}
  #hero h1 em{color:var(--rose)}
  #hero .hand{font-size:clamp(1.6rem,5vw,2.4rem);color:var(--rose);margin-bottom:10px}
  #hero .sub{margin-top:22px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;font-size:.8rem}
  .scroll-cue{position:absolute;bottom:28px;font-size:.75rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;animation:bob 2.4s infinite}

  /* ---------- Counter ---------- */
  .counter{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
  .unit{background:#fff;border:1px solid #f0dde1;border-radius:18px;padding:26px 8px;text-align:center}
  .unit b{display:block;font-family:Fraunces,serif;font-weight:300;font-size:clamp(2rem,7vw,3.6rem);color:var(--plum);font-variant-numeric:tabular-nums}
  .unit span{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .since{margin-top:18px;color:var(--muted);font-size:.9rem}

  /* ---------- Timeline ---------- */
  .timeline{position:relative;margin-top:50px}
  .timeline::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:linear-gradient(var(--blush),var(--rose),var(--blush))}
  .moment{position:relative;padding:0 0 44px 58px}
  .moment::before{content:"♥";position:absolute;left:6px;top:0;width:26px;height:26px;border-radius:50%;background:var(--cream);color:var(--rose);display:grid;place-items:center;font-size:14px;border:2px solid var(--rose)}
  .moment .date{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);font-weight:500}
  .moment h3{font-size:1.5rem;color:var(--plum);margin:6px 0}
  .moment p{color:var(--muted);line-height:1.6;max-width:520px}
  @media(min-width:760px){
    .timeline::before{left:50%;transform:translateX(-50%)}
    .moment{width:50%;padding:0 52px 56px 0;text-align:right}
    .moment::before{left:auto;right:-13px}
    .moment:nth-child(even){margin-left:50%;padding:0 0 56px 52px;text-align:left}
    .moment:nth-child(even)::before{right:auto;left:-13px}
    .moment p{margin-left:auto}
    .moment:nth-child(even) p{margin-left:0}
  }

  /* ---------- Gallery ---------- */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px;margin-top:44px}
  .polaroid{background:#fff;padding:10px 10px 0;box-shadow:0 10px 30px rgba(90,30,58,.12);border-radius:3px;cursor:pointer;transition:transform .35s ease}
  .polaroid:nth-child(odd){transform:rotate(-2.5deg)}
  .polaroid:nth-child(even){transform:rotate(2deg)}
  .polaroid:hover{transform:rotate(0) scale(1.04);z-index:2}
  .polaroid .ph{aspect-ratio:1;border-radius:2px;display:grid;place-items:center;font-size:2.2rem;background-size:cover;background-position:center}
  .polaroid .cap{font-family:Caveat,cursive;font-size:1.25rem;text-align:center;padding:10px 4px 12px;color:var(--plum)}
  #lightbox{position:fixed;inset:0;background:rgba(43,22,32,.88);z-index:40;display:none;place-items:center;padding:24px}
  #lightbox.on{display:grid}
  #lightbox .polaroid{transform:none;max-width:min(440px,90vw);width:100%;cursor:default}
  #lightbox .cap{font-size:1.6rem}

  /* ---------- Reasons ---------- */
  #reasons{text-align:center}
  #reasons .lead{margin-inline:auto}
  .card-stage{perspective:1200px;margin:44px auto 0;width:min(360px,88vw);aspect-ratio:3/4;cursor:pointer;position:relative}
  .rcard{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.3,1)}
  .rcard.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:34px;box-shadow:0 24px 50px rgba(90,30,58,.2)}
  .front-f{background:linear-gradient(150deg,var(--plum),#8b2f57);color:var(--blush)}
  .front-f .big{font-family:Fraunces,serif;font-size:5rem;font-weight:300;line-height:1}
  .front-f small{letter-spacing:.22em;text-transform:uppercase;font-size:.72rem;margin-top:14px;opacity:.8}
  .back-f{background:var(--paper);transform:rotateY(180deg);border:1px solid #efdcc6}
  .back-f .n{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
  .back-f p{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:1.55rem;line-height:1.35;color:var(--plum);margin-top:16px}
  .hint{margin-top:22px;color:var(--muted);font-size:.85rem}

  /* ---------- Letter ---------- */
  .letter{background:var(--paper);border-radius:6px;padding:clamp(28px,6vw,60px);margin-top:40px;box-shadow:0 20px 50px rgba(90,30,58,.1);position:relative;background-image:repeating-linear-gradient(transparent 0 37px,#efdccb 37px 38px)}
  .letter .hand{font-size:clamp(1.35rem,3.6vw,1.7rem);line-height:38px;color:#3b2230;white-space:pre-wrap;min-height:200px}
  .letter .caret{display:inline-block;width:2px;height:1.2em;background:var(--rose);vertical-align:middle;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- Finale ---------- */
  #finale{text-align:center;min-height:90svh;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .btns{display:flex;gap:16px;margin-top:38px;position:relative;min-height:60px;justify-content:center;flex-wrap:wrap}
  button{font:inherit;border:0;cursor:pointer}
  .yes{background:var(--rose);color:#fff;padding:16px 38px;border-radius:999px;font-size:1.05rem;font-weight:500;box-shadow:0 12px 28px
